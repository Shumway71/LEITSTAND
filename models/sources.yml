version: 2

sources:
  - name: raw
    database: dwh-db-504211
    schema: DWH
    tables:
      - name: weather_daily
        identifier: weather_daily
        description: "Raw weather daily data from Open-Meteo API via Meltano tap-openmeteo"
        columns:
          - name: data
            description: "Full JSON response"
          - name: _sdc_extracted_at
            description: "Timestamp when record was extracted by Meltano"
          - name: _sdc_received_at
            description: "Timestamp when record was received by Meltano"
          - name: _sdc_batched_at
            description: "Timestamp when record was batched by Meltano"
          - name: _sdc_sequence
            description: "Sequence number for ordering"
      - name: weather_hourly
        identifier: weather_hourly
        description: "Raw weather hourly data from Open-Meteo API via Meltano tap-openmeteo"
        columns:
          - name: data
            description: "Full JSON response"
          - name: _sdc_extracted_at
            description: "Timestamp when record was extracted by Meltano"
          - name: _sdc_received_at
            description: "Timestamp when record was received by Meltano"
          - name: _sdc_batched_at
            description: "Timestamp when record was batched by Meltano"
          - name: _sdc_sequence
            description: "Sequence number for ordering"

  - name: DWH
